# Included inside nginx's http block. Reuses the existing local wildcard certificate.
map $http_upgrade $vault_dev_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name vault.xxx.com;

    ssl_certificate /opt/homebrew/etc/nginx/ssl/xxx.com.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/xxx.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log off;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    # Preserve the Java endpoint paths; these locations do not strip /api.
    location /vault-auth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/vault/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The browser uses HTTPS; Umi runs HTTP locally and supplies source maps and HMR.
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vault_dev_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
