# Environment template; generate nginx.dev.local.conf with npm run nginx:dev.
# Include the generated configuration inside nginx's http block.
map $http_upgrade $vault_dev_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name ${VAULT_DEV_HOST};

    ssl_certificate "${VAULT_NGINX_CERT}";
    ssl_certificate_key "${VAULT_NGINX_KEY}";
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log off;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    # Preserve the complete Java endpoint paths, including /vault.
    # Keep proxy_pass without a URI or trailing slash to avoid stripping the prefix.
    location /vault/auth/ {
        proxy_pass ${VAULT_NGINX_API_TARGET};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /vault/api/ {
        proxy_pass ${VAULT_NGINX_API_TARGET};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The browser uses HTTPS; Umi runs HTTP locally and supplies source maps and HMR.
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vault_dev_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
